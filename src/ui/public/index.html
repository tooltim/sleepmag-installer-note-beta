<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sleep Network</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="icon" href="/icon.png" type="image/png" />
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <img class="brand-lockup" src="/lockup.png" alt="Sleep Magazine" />
        <p class="brand-name">Sleep Network</p>
        <p class="lede">One short setup. Then you work from the desktop launcher.</p>
      </header>

      <section id="state-panel" class="panel state" hidden>
        <h2 class="state-title">
          <span id="state-badge" class="badge">checking…</span>
          <span id="state-summary" class="state-summary"></span>
        </h2>
        <ul id="state-checks" class="checks"></ul>
        <div id="state-extra" class="state-extra"></div>
      </section>

      <section id="form-panel" class="panel">
        <form id="install-form" autocomplete="on">
          <label>
            First name
            <input id="name" name="name" type="text" required autocomplete="given-name" />
          </label>
          <label>
            Work e-mail
            <input id="email" name="email" type="email" required autocomplete="email" />
          </label>
          <label>
            Team passphrase
            <input
              id="passphrase"
              name="passphrase"
              type="password"
              required
              autocomplete="current-password"
              placeholder="Tim gives you this"
            />
          </label>
          <label>
            Assistant (optional)
            <select id="assistant" name="assistant">
              <option value="none" selected>Skip — already installed</option>
              <option value="claude">Claude Code</option>
              <option value="codex">Codex</option>
              <option value="gemini">Gemini CLI</option>
              <option value="all">Install all three</option>
            </select>
          </label>
          <label>
            Install folder
            <input id="dest" name="dest" type="text" spellcheck="false" autocomplete="off" />
            <span class="field-note">
              The workspace folder. Keep it off OneDrive, iCloud and Dropbox — sync corrupts the
              checkout.
            </span>
          </label>
          <div id="dest-choices" class="choices"></div>
          <p id="dest-status" class="dest-status" hidden></p>
          <label id="allow-cloud-row" class="checkbox" hidden>
            <input id="allow-cloud" name="allowCloud" type="checkbox" />
            <span>Use this synced folder anyway (not recommended)</span>
          </label>
          <label id="remove-previous-row" class="checkbox" hidden>
            <input id="remove-previous" name="removePrevious" type="checkbox" />
            <span id="remove-previous-label">Delete the previous install</span>
          </label>
          <p id="form-error" class="error" hidden></p>
          <button type="submit" id="start-btn">
            <span class="btn-label">Continue</span>
            <span class="btn-busy" hidden><span class="spinner" aria-hidden="true"></span> Working…</span>
          </button>
        </form>
      </section>

      <section id="progress-panel" class="panel" hidden>
        <h2 id="progress-title" class="progress-title">
          <span class="spinner title-spinner" aria-hidden="true"></span>
          <span id="progress-title-text">Working…</span>
        </h2>
        <ol id="steps" class="steps"></ol>
        <details id="log-details" class="log-wrap">
          <summary>
            <span>Details</span>
            <button type="button" id="copy-log" class="ghost">Copy log</button>
          </summary>
          <pre id="log" class="log" aria-live="polite"></pre>
          <p class="log-path">Log file: <code id="log-path"></code></p>
        </details>
        <div id="result" class="result" hidden></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
