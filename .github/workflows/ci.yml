name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: npm test
      - name: Check mode smoke
        run: SLEEPNET_MODE=check node bin/install.js

  # Real macOS: the unit tests, then the actual one-liner bootstrap (install.sh)
  # in check mode, run from THIS branch so a PR tests its own copy.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: install.sh syntax (bash 3.2, the one macOS ships)
        run: /bin/bash -n scripts/install.sh
      - name: Bootstrap one-liner, check mode
        env:
          SLEEPNET_MODE: check
          SLEEPNET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: /bin/bash scripts/install.sh
      # curl | bash reads the script from a pipe while running it: a command that
      # reads stdin (brew install did, on a real Mac) used to swallow the rest and
      # end the script silently. A node shim that drains stdin reproduces that.
      - name: Piped like curl | bash, with a stdin-eating command
        env:
          SLEEPNET_MODE: check
          SLEEPNET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/shim"
          printf '#!/bin/bash\ncat >/dev/null\nexec "%s" "$@"\n' "$(command -v node)" > "$RUNNER_TEMP/shim/node"
          chmod +x "$RUNNER_TEMP/shim/node"
          cat scripts/install.sh | PATH="$RUNNER_TEMP/shim:$PATH" /bin/bash | tee "$RUNNER_TEMP/piped.txt"
          grep -q "Sleep Network installer" "$RUNNER_TEMP/piped.txt"

  # Windows stays the main platform: the same tests on a real Windows runner.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
